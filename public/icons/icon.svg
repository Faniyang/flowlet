<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-cool" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9FBFF" />
      <stop offset="100%" stop-color="#EEF3FB" />
    </linearGradient>

    <linearGradient id="sapphire-flow" x1="110" y1="130" x2="402" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="52%" stop-color="#2B5BEE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="wave-fill" x1="256" y1="194" x2="256" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2B5BEE" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <clipPath id="ring-inner">
      <circle cx="256" cy="256" r="146" />
    </clipPath>
  </defs>

  <!-- 背景：纯净冷瓷白微渐变 -->
  <rect width="512" height="512" rx="116" fill="url(#bg-cool)" />

  <!-- 圆内流体波浪与冰蓝淡影（严格裁切于圆环内壁，无缝衔接） -->
  <g clip-path="url(#ring-inner)">
    <path
      d="M 102 276 C 130 228, 156 222, 182 236 C 208 250, 228 286, 256 284 C 284 282, 304 202, 336 196 C 366 190, 388 224, 412 260 L 412 416 L 102 416 Z"
      fill="url(#wave-fill)"
    />
    <path
      d="M 102 276 C 130 228, 156 222, 182 236 C 208 250, 228 286, 256 284 C 284 282, 304 202, 336 196 C 366 190, 388 224, 412 260"
      fill="none"
      stroke="url(#sapphire-flow)"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- 极简圆环外框 -->
  <circle
    cx="256"
    cy="256"
    r="146"
    fill="none"
    stroke="url(#sapphire-flow)"
    stroke-width="14"
  />
</svg>
